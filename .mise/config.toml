[tools]
just = "1.58.0"
node = "26.5.0"
pnpm = "12.12.1"
pre-commit = "4.6.2"
"npm:oxfmt-next-line" = { version = "0.75.0", allow_low_downloads = true }
# pre-commit and its pre-commit-hooks and yamllint hooks run on Python. Pin it
# here, since mise refuses a python3 shim that resolves back to itself.
python = "3.15.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
# Skip releases younger than 24 hours when mise chooses a version (`mise upgrade`, `latest`, ranges),
# enforcing the 24-hour version policy. An exact version pinned here still installs.
minimum_release_age = "1d"
# Required for [hooks] below; scoped to this repo only.
experimental = true

[hooks]
# better-sqlite3 ships a native binary tied to Node's ABI. When mise provisions
# a different Node version, the cached binary's NODE_MODULE_VERSION no longer
# matches and every DB call throws. Rebuild it whenever tools are (re)installed.
postinstall = "pnpm rebuild better-sqlite3"
