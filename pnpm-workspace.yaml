shamefullyHoist: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - node-pty
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.5
  vite-plus: 1.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Older postcss reads arbitrary .map files from an attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q).
  postcss: ">=8.5.23"
  "@tanstack/router-core": 1.171.7
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@sentry/cli": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  fallow: true
  node-pty: true
  unrs-resolver: true
