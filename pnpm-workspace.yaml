shamefullyHoist: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # vite-plus-test hard-pins an older core; force one core version graph-wide,
  # otherwise vitest startup fails with InvalidArg (mixed core JS/native).
  "@voidzero-dev/vite-plus-core": "0.2.5"
  "@tanstack/router-core": 1.171.7
patchedDependencies:
  "@git-diff-view/lowlight@0.1.7": patches/@git-diff-view__lowlight@0.1.7.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@sentry/cli": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  fallow: true
  unrs-resolver: true
