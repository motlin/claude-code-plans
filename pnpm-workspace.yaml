shamefullyHoist: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - node-pty
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.1.0
  vite-plus: 1.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Older postcss reads arbitrary .map files from an attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q).
  postcss: ">=8.5.23"
  "@tanstack/router-core": 1.171.39
  # @tailwindcss/node pins lightningcss 1.32.0, which warns on every ::highlight() rule; 1.33 parses them.
  "@tailwindcss/node>lightningcss": 1.33.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@sentry/cli": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  fallow: true
  node-pty: true
  unrs-resolver: true
patchedDependencies:
  # dnd-kit 6.3 never detaches a drag's sensor when its DndContext unmounts mid-drag, and its KeyboardSensor attaches
  # its document keydown listener on a timeout a detach doesn't cancel, so an orphaned listener swallowed arrow keys
  # (⌥⌘↑ prompt jump) for the rest of the page. Re-apply on upgrades.
  "@dnd-kit/core@6.3.1": patches/@dnd-kit__core@6.3.1.patch
  # jsdom 31 never re-arms its animation frame interval once fake timers drop it while a focus fixup is pending, so
  # every later requestAnimationFrame in that window (Base UI's initial focus) never runs. Re-apply on upgrades.
  jsdom@31.0.0: patches/jsdom@31.0.0.patch
  # Upstream's mermaid guard (src/lib/mermaid-guard.ts) needs mermaid to hand it each parsed diagram and to charge
  # each label it measures; without the patch every diagram is refused (MermaidGuardNotRun). Re-apply on upgrades.
  mermaid@11.17.2: patches/mermaid@11.17.2.patch
